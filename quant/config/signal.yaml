signal:
  enable_cooldown: true
  emit_only_on_switch: true

  buy_to_exit_cooldown_hours: 3
  exit_to_buy_cooldown_hours: 3

  default_action: hold

  # range mode thresholds, based on range_position_short: 0~1
  range_buy_position_threshold: 0.30
  range_reduce_position_threshold: 0.70
  range_sell_position_threshold: 0.85

  # risk actions
  exhausted_action: reduce
  breakdown_action: sell
  high_risk_action: sell
  risk_off_action: avoid