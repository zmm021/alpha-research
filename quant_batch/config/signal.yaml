signal:
  enable_risk_filter: true
  enable_sector_filter: true

  allow_trend_buy: true
  allow_pullback_buy: true
  allow_breakout_buy: true

  breakout_requires_non_weak_sector: true

  exhausted_action: "reduce"
  breakdown_action: "sell"
  high_risk_action: "sell"
  default_action: "hold"
  allow_range_buy: true
 
  range_upper_action: sell
  range_distribution_action: reduce

  range_score_scale: 1.0
  macro_range_penalty: 0.5
  sector_range_penalty: 0.7
 
  range_reduce_threshold: -0.3 
  range_buy_threshold: 0.4
  range_reduce_threshold: -0.3
  range_sell_threshold: -0.4